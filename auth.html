<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Астория — Вход и Регистрация</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-container">
    <div class="tabs">
      <button id="tab-login-btn" class="tab-btn active">Вход</button>
      <button id="tab-register-btn" class="tab-btn">Регистрация</button>
    </div>

    <!-- Форма входа -->
    <form id="login-form" class="auth-form">
      <h2>Вход в Асторию</h2>
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Пароль" required>
      <button type="submit" class="btn">Войти</button>
      <p id="login-error" class="error-msg"></p>
    </form>

    <!-- Форма регистрации -->
    <form id="register-form" class="auth-form hidden">
      <h2>Регистрация</h2>
      
      <label for="reg-username">Уникальный хэндл (@username):</label>
      <input type="text" id="reg-username" placeholder="founder (от 4 до 20 символов)" minlength="4" maxlength="20" required pattern="[A-Za-z0-9_]+">
      
      <label for="reg-displayname">Отображаемое имя (Ник):</label>
      <input type="text" id="reg-displayname" placeholder="Иван Иванов" required>

      <label for="reg-email">Email:</label>
      <input type="email" id="reg-email" placeholder="email@example.com" required>

      <label for="reg-password">Пароль:</label>
      <input type="password" id="reg-password" placeholder="Пароль (8-20 символов)" minlength="8" maxlength="20" required>

      <button type="submit" class="btn">Зарегистрироваться</button>
      <p id="register-error" class="error-msg"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
