<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Астория — Форум и общение</title>
  <link rel="stylesheet" href="style.css">
  <!-- Подключаем библиотеку Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-container">
    <header class="navbar">
      <h1 class="logo">Астория</h1>
      <div id="user-nav" class="hidden">
        <span id="nav-nickname"></span> <span id="nav-username" class="muted"></span>
        <button id="logout-btn" class="btn btn-small">Выйти</button>
      </div>
    </header>

    <!-- Форма регистрации -->
    <div id="auth-box" class="card">
      <h2>Регистрация в Астории</h2>
      <form id="register-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="example@mail.com" required>
        </div>
        <div class="input-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="input-group">
          <label for="username">Имя пользователя (Username)</label>
          <input type="text" id="username" placeholder="astoria_user" required>
        </div>
        <div class="input-group">
          <label for="nickname">Никнейм</label>
          <input type="text" id="nickname" placeholder="Мое Имя" required>
        </div>
        <button type="submit" class="btn">Войти в Асторию</button>
      </form>
    </div>

    <!-- Главная страница форума (Лента постов) -->
    <main id="forum-box" class="hidden">
      <!-- Форма создания поста -->
      <div class="card create-post">
        <h3>Создать пост</h3>
        <textarea id="post-input" placeholder="Что у вас нового?" rows="3" required></textarea>
        <button id="publish-btn" class="btn">Опубликовать</button>
      </div>

      <!-- Лента публикаций -->
      <div id="posts-feed" class="feed">
        <p class="muted text-center">Загрузка постов...</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
